name: Update data and deploy

on:
  schedule:
    # Twice daily: 22:00 UTC = 07:00 JST, 10:00 UTC = 19:00 JST
    - cron: "0 22 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Scrape, screen, commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape earnings schedule
        run: python scripts/scrape_schedule.py

      - name: Fetch fundamentals from IR Bank
        run: python scripts/fetch_fundamentals.py

      - name: Run screening
        run: python scripts/screen.py

      - name: Show results summary
        run: |
          echo "=== last_updated.json ==="
          cat docs/data/last_updated.json
          echo
          echo "=== screened (first 20) ==="
          python -c "import json; d=json.load(open('docs/data/screened.json')); [print(i['code'], i['name'], 'score=', i['score']) for i in d['items'][:20]]"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
